<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NAG-25-953</title>
    <script src="https://unpkg.com/blockly/blockly.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- level select screen -->
    <div id="levelSelectScreen" class="ls-screen">

        <div class="ls-bg-grid" aria-hidden="true"></div>

        <div class="ls-container">

            <header class="ls-header">
                <div class="ls-header-left">
                    <div class="ls-logo">
                        <span class="ls-logo-icon">🤖</span>
                        <span class="ls-logo-text">NAG-25-953</span>
                    </div>
                    <p class="ls-tagline">Honour-Stage-Project_202314286</p>
                </div>
                <button id="signOutBtn" class="sign-out-btn">Sign Out</button>
            </header>

            <div class="ls-section-header">
                <h1 class="ls-section-title">Choose a Level</h1>
                <p class="ls-section-sub">Complete each category to unlock the next one.</p>
            </div>

            <nav class="ls-tabs" id="lsTabs" role="tablist" aria-label="Level categories">
                <button class="ls-tab ls-tab--active"
                        role="tab" aria-selected="true"
                        data-category="basics">
                    <span class="ls-tab-icon">🚀</span>
                    <span class="ls-tab-label">Movement Basics</span>
                </button>
                <button class="ls-tab ls-tab--locked"
                        role="tab" aria-selected="false"
                        data-category="loops" disabled
                        title="Complete Movement Basics to unlock">
                    <span class="ls-tab-icon">🔁</span>
                    <span class="ls-tab-label">Loops</span>
                    <span class="ls-tab-lock" aria-label="locked">🔒</span>
                </button>
                <button class="ls-tab ls-tab--locked"
                        role="tab" aria-selected="false"
                        data-category="obstacles" disabled
                        title="Complete Loops to unlock">
                    <span class="ls-tab-icon">🧱</span>
                    <span class="ls-tab-label">Obstacles</span>
                    <span class="ls-tab-lock" aria-label="locked">🔒</span>
                </button>
                <button class="ls-tab ls-tab--locked"
                        role="tab" aria-selected="false"
                        data-category="conditionals" disabled
                        title="Complete Obstacles to unlock">
                    <span class="ls-tab-icon">🔀</span>
                    <span class="ls-tab-label">Conditionals</span>
                    <span class="ls-tab-lock" aria-label="locked">🔒</span>
                </button>
            </nav>

            <main class="ls-grid" id="levelGrid" role="list" aria-label="Available levels">
                <div class="ls-skeleton" aria-hidden="true"></div>
                <div class="ls-skeleton" aria-hidden="true" style="animation-delay:.1s"></div>
                <div class="ls-skeleton" aria-hidden="true" style="animation-delay:.2s"></div>
                <div class="ls-skeleton" aria-hidden="true" style="animation-delay:.3s"></div>
            </main>

            <footer class="ls-footer">
                <div class="ls-footer-stat">
                    <span class="ls-footer-icon">⭐</span>
                    <span class="ls-footer-value" id="lsTotalStars">—</span>
                    <span class="ls-footer-label">Total Stars</span>
                </div>
                <div class="ls-footer-stat">
                    <span class="ls-footer-icon">✅</span>
                    <span class="ls-footer-value" id="lsCompletedCount">—</span>
                    <span class="ls-footer-label">Levels Done</span>
                </div>
            </footer>

        </div>
    </div>


    <!-- game screen - hidden until a level is selected -->
    <div class="container hidden" id="gameContainer">

        <!-- objective banner - populated by launchLevel() -->
        <div class="objective-banner" id="objectiveBanner">
            <div class="objective-banner-inner">
                <span class="objective-label">🎯 Objective</span>
                <span class="objective-title" id="objectiveTitle"></span>
                <span class="objective-desc" id="objectiveDesc"></span>
            </div>
        </div>

        <div class="game-columns">

            <div class="column left-column">
                <div class="column-heading">
                    <span class="column-heading-icon">🧩</span>
                    <h2>Block Programming</h2>
                </div>

                <!-- blocklyDiv - toolbox defined below as static xml -->
                <div id="blocklyDiv"></div>

                <xml id="toolbox" style="display: none">
                    <category name="Movement" colour="160">
                        <block type="move_forward"></block>
                        <block type="move_backward"></block>
                        <block type="turn_right"></block>
                        <block type="turn_left"></block>
                    </category>
                    <category name="Loops" colour="120">
                        <block type="controls_repeat_ext">
                            <value name="TIMES">
                                <shadow type="math_number">
                                    <field name="NUM">3</field>
                                </shadow>
                            </value>
                        </block>
                    </category>
                    <category name="Sensors" colour="65">
                        <block type="if_path_clear"></block>
                    </category>
                </xml>

                <button id="runButton" class="run-button">▶ Run Code</button>
                <div class="game-btn-row">
                    <button id="resetButton" class="reset-button">↺ Reset</button>
                    <button id="backButton" class="back-button">← Level Select</button>
                </div>
            </div>

            <div class="column right-column">
                <div class="column-heading">
                    <span class="column-heading-icon">🤖</span>
                    <h2>Robot Canvas</h2>
                </div>
                <canvas id="robotCanvas" width="600" height="600"></canvas>
            </div>

        </div>
    </div>


    <!-- level launch transition overlay -->
    <div id="levelTransition" class="level-transition hidden" aria-hidden="true">
        <div class="level-transition-inner">
            <p class="level-transition-label">Get Ready</p>
            <h2 class="level-transition-title" id="transitionTitle"></h2>
            <div class="level-transition-dots">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </div>

    <!-- win modal -->
    <div id="winModal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-emoji" aria-hidden="true">🎉</div>
            <h2>Level Complete!</h2>
            <p>Great job! You programmed the robot to reach the target.</p>
            <div id="winStars" class="win-stars"></div>
            <button id="nextLevelBtn" class="run-button">Next Level →</button>
            <button id="retryBtn" class="retry-button">Try Again</button>
            <button id="backToMenuBtn" class="reset-button" style="margin-top:8px">Back to Menu</button>
        </div>
    </div>


    <!-- scripts - order matters -->
    <script src="supabase.js"></script>
    <script src="robot.js"></script>
    <script src="app.js"></script>
    <script src="level_select.js"></script>

</body>
</html>
