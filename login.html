<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NAG-25-953 | Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="auth-wrapper">
        <div class="auth-card">

            <h1 class="auth-title">NAG-25-953</h1>
            <p class="auth-subtitle">Sign in to continue</p>

            <!-- tabs -->
            <div class="auth-tabs">
                <button class="auth-tab auth-tab--active" data-tab="signin">Sign In</button>
                <button class="auth-tab" data-tab="signup">Sign Up</button>
            </div>

            <!-- sign in form -->
            <div id="signinForm">
                <div class="auth-field">
                    <label>Email</label>
                    <input type="email" id="signinEmail" placeholder="your@email.com">
                </div>
                <div class="auth-field">
                    <label>Password</label>
                    <input type="password" id="signinPassword" placeholder="••••••••">
                </div>
                <p class="auth-error hidden" id="signinError"></p>
                <button class="run-button auth-submit" id="signinBtn">Sign In</button>
            </div>

            <!-- sign up form -->
            <div id="signupForm" class="hidden">
                <div class="auth-field">
                    <label>Display Name</label>
                    <input type="text" id="signupName" placeholder="Your name">
                </div>
                <div class="auth-field">
                    <label>Email</label>
                    <input type="email" id="signupEmail" placeholder="your@email.com">
                </div>
                <div class="auth-field">
                    <label>Password</label>
                    <input type="password" id="signupPassword" placeholder="••••••••">
                </div>
                <p class="auth-error hidden" id="signupError"></p>
                <button class="run-button auth-submit" id="signupBtn">Create Account</button>
            </div>

        </div>
    </div>

    <script src="supabase.js"></script>
    <script src="auth.js"></script>

</body>
</html>
