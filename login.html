<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MioCode — Sign In</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="auth-wrapper">
        <div class="auth-card">

            <!-- logo matches level select header -->
            <div class="auth-logo">
            <!-- Mio mascot — neutral, blink via SVG SMIL -->
                <svg class="auth-logo-mio" width="52" height="68" viewBox="0 0 100 130" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
                    <ellipse cx="17" cy="38" rx="9" ry="12" fill="#ECEEF4"/>
                    <ellipse cx="83" cy="38" rx="9" ry="12" fill="#ECEEF4"/>
                    <ellipse cx="50" cy="44" rx="34" ry="30" fill="#ECEEF4"/>
                    <rect x="17" y="66" width="66" height="44" rx="20" fill="#ECEEF4"/>
                    <rect x="17" y="95" width="66" height="15" rx="20" fill="#E0E3EC"/>
                    <rect x="22" y="107" width="22" height="13" rx="6" fill="#F5A623"/>
                    <rect x="56" y="107" width="22" height="13" rx="6" fill="#F5A623"/>
                    <rect x="18" y="30" width="64" height="28" rx="14" fill="#F5A623"/>
                    <circle cx="36" cy="44" r="9" fill="#1A1A2E"/>
                    <circle cx="36" cy="44" r="6" fill="#FFD060"/>
                    <circle cx="36" cy="44" r="3" fill="#FFE590"/>
                    <ellipse cx="32" cy="40" rx="2.5" ry="1.8" fill="white" opacity="0.6" transform="rotate(-20 32 40)"/>
                    <circle cx="64" cy="44" r="9" fill="#1A1A2E"/>
                    <circle cx="64" cy="44" r="6" fill="#FFD060"/>
                    <circle cx="64" cy="44" r="3" fill="#FFE590"/>
                    <ellipse cx="60" cy="40" rx="2.5" ry="1.8" fill="white" opacity="0.6" transform="rotate(-20 60 40)"/>
                    <rect x="18" y="30" width="30" fill="#F5A623"><animate attributeName="height" values="12;12;38;12;12" keyTimes="0;0.8;0.88;0.96;1" dur="3.8s" repeatCount="indefinite"/></rect>
                    <ellipse cx="36" rx="15" ry="5" fill="#F5A623"><animate attributeName="cy" values="42;42;68;42;42" keyTimes="0;0.8;0.88;0.96;1" dur="3.8s" repeatCount="indefinite"/></ellipse>
                    <rect x="52" y="30" width="30" fill="#F5A623"><animate attributeName="height" values="12;12;38;12;12" keyTimes="0;0.8;0.88;0.96;1" dur="3.8s" begin="0.07s" repeatCount="indefinite"/></rect>
                    <ellipse cx="64" rx="15" ry="5" fill="#F5A623"><animate attributeName="cy" values="42;42;68;42;42" keyTimes="0;0.8;0.88;0.96;1" dur="3.8s" begin="0.07s" repeatCount="indefinite"/></ellipse>
                    <line x1="50" y1="14" x2="50" y2="30" stroke="#C8CBD8" stroke-width="4" stroke-linecap="round"/>
                    <circle cx="50" cy="8" r="8" fill="#3DAA6E"/>
                    <circle cx="46" cy="4" r="3" fill="#5DC98A"/>
                </svg>
                <span class="auth-title">MioCode</span>
            </div>
            <p class="auth-subtitle">Sign in to start learning</p>

            <!-- tabs -->
            <div class="auth-tabs">
                <button class="auth-tab auth-tab--active" data-tab="signin">Sign In</button>
                <button class="auth-tab" data-tab="signup">Sign Up</button>
            </div>

            <!-- sign in form -->
            <div id="signinForm">
                <div class="auth-field">
                    <label for="signinEmail">Email</label>
                    <input type="email" id="signinEmail" placeholder="your@email.com" autocomplete="email">
                </div>
                <div class="auth-field">
                    <label for="signinPassword">Password</label>
                    <input type="password" id="signinPassword" placeholder="••••••••" autocomplete="current-password">
                </div>
                <p class="auth-error hidden" id="signinError"></p>
                <button class="run-button auth-submit" id="signinBtn">Sign In</button>
            </div>

            <!-- sign up form (students only - teachers created via supabase dashboard) -->
            <div id="signupForm" class="hidden">
                <div class="auth-field">
                    <label for="signupName">Display Name</label>
                    <input type="text" id="signupName" placeholder="Your name" autocomplete="name">
                </div>
                <div class="auth-field">
                    <label for="signupEmail">Email</label>
                    <input type="email" id="signupEmail" placeholder="your@email.com" autocomplete="email">
                </div>
                <div class="auth-field">
                    <label for="signupPassword">Password</label>
                    <input type="password" id="signupPassword" placeholder="••••••••" autocomplete="new-password">
                </div>
                <p class="auth-error hidden" id="signupError"></p>
                <button class="run-button auth-submit" id="signupBtn">Create Account</button>
            </div>

        </div>
    </div>

    <script src="supabase.js"></script>
    <script src="auth.js"></script>

</body>
</html>
